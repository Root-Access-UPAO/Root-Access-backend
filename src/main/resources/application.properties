spring.application.name=eventociber

# Conexión a BD (Producción/Entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Manejo de errores seguro (no exponer stack traces ni mensajes internos)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Configuración para manejar 404 correctamente en el GlobalExceptionHandler
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Hibernate escribe valores de la BD en sus mensajes de error.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Seguridad y proxy (solo cambiar strategy si hay un proxy de confianza)
server.forward-headers-strategy=none

# Configuración personalizada: CORS y Rate Limit
app.cors.origenes=${CORS_ORIGINES}
ratelimit.capacidad=60
ratelimit.ventana-segundos=60
ratelimit.global=500

app.max-body-bytes=10240
server.max-http-request-header-size=8KB
