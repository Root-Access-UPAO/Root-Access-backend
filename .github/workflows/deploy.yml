name: CI/CD to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  build-and-test:
    name: Build and Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven
        run: chmod +x ./mvnw

      - name: Compilar y correr pruebas
        run: ./mvnw clean test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ORIGINES: ${{ secrets.CORS_ORIGINES }}

  # ==========================================
  # FASE 2: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  deploy:
    name: Deploy to Cloud Run (CD)
    runs-on: ubuntu-latest
    needs: build-and-test # Esta línea asegura que el CD solo se ejecute si el CI pasó con éxito
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Desplegar en Cloud Run (Buildpacks)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: root-access-backend
          region: us-central1
          source: .
          env_vars: |
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            CORS_ORIGINES=${{ secrets.CORS_ORIGINES }}
